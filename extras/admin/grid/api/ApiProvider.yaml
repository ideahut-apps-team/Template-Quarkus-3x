order: 4
name: ApiProvider
title: Source
crud:
    name: net.ideahut.quarkus.api.entity.ApiProvider
    joins:
        -
            name: net.ideahut.quarkus.api.entity.ApiGate
            alias: ApiGate
            store: apiGate
            match: contain
            relations:
                -
                    source: gateId
                    target: gateId
id:
    type: STANDARD
    fields:
        - apiName
table:
    separator: cell
    selection: single
    page:
        options: [5, 10, 15, 20, 25, 30, 50]
        default: 20
        count: false
    order:
        field: createdOn
        descending: true
    filters:
        -
            name: apiName
            label: ApiName
            type: text
            condition: ANY_LIKE
        -
            name: ApiGate.name
            label: Gate
            type: text
            condition: ANY_LIKE
        -
            name: isActive
            label: Active
            type: option
            option: YES_NO
            condition: EQUAL
        -
            name: isCheckHost
            label: Check Host
            type: option
            option: YES_NO
            condition: EQUAL
        -
            name: isCheckTime
            label: Check Time
            type: option
            option: YES_NO
            condition: EQUAL
        -
            name: digest
            label: Digest
            type: option
            option: DIGEST
            condition: EQUAL
        -
            name: baseUrl
            label: Base Url
            type: text
            condition: ANY_LIKE
    visibles:
        - apiName
        - ApiGate.name
        - isActive
        - digest
        - isCheckHost
        - baseUrl
        - accessEndpoint
        - connectTimeout
        - readTimeout
        - isCheckTime
        - lowerTimeSpan
        - upperTimeSpan
        - accessNullExpiry
        - accessExistExpiry
        - tokenNullExpiry
        - tokenExistExpiry
        - updatedOn
        - createdOn
    columns:
        -
            name: apiName
            label: ApiName
            field: apiName
            align: left
            sortable: true
        -
            name: ApiGate.name
            label: Gate
            field: apiGate
            align: left
            sortable: true
            format: >-
                function(val, row) { return $h.grid.field(val, 'name'); }
        -
            name: isActive
            label: Active
            field: isActive
            align: center
            sortable: true
            format: >-
                function(val, row) { return $h.grid.option(val, row, 'YES_NO'); }
        -
            name: digest
            label: Digest
            field: digest
            align: left
            sortable: true
            format: >-
                function(val, row) { return $h.grid.option(val, row, 'DIGEST'); }
        -
            name: secret
            label: Secret
            field: secret
            align: left
            sortable: true
        -
            name: isCheckHost
            label: Check Host
            field: isCheckHost
            align: center
            sortable: true
            format: >-
                function(val, row) { return $h.grid.option(val, row, 'YES_NO'); }
        -
            name: baseUrl
            label: Base Url
            field: baseUrl
            align: left
            sortable: true
        -
            name: accessEndpoint
            label: Access Endpoint
            field: accessEndpoint
            align: left
            sortable: true
        -
            name: connectTimeout
            label: Connect Timeout (Seconds)
            field: connectTimeout
            align: right
            sortable: true
        -
            name: readTimeout
            label: Read Timeout (Seconds)
            field: readTimeout
            align: right
            sortable: true
        -
            name: isCheckTime
            label: Check Time
            field: isCheckTime
            align: center
            sortable: true
            format: >-
                function(val, row) { return $h.grid.option(val, row, 'YES_NO'); }
        -
            name: lowerTimeSpan
            label: Lower Time Span (Seconds)
            field: lowerTimeSpan
            align: right
            sortable: true
        -
            name: upperTimeSpan
            label: Upper Time Span (Seconds)
            field: upperTimeSpan
            align: right
            sortable: true
        -
            name: accessNullExpiry
            label: Access Null Expiry (Seconds)
            field: accessNullExpiry
            align: right
            sortable: true
        -
            name: accessExistExpiry
            label: Access Exist Expiry (Seconds)
            field: accessExistExpiry
            align: right
            sortable: true
        -
            name: tokenNullExpiry
            label: Token Null Expiry (Seconds)
            field: tokenNullExpiry
            align: right
            sortable: true
        -
            name: tokenExistExpiry
            label: Token Exist Expiry (Seconds)
            field: tokenExistExpiry
            align: right
            sortable: true
        -
            name: updatedOn
            label: UpdatedOn
            field: updatedOn
            align: center
            sortable: true
            format: >-
                function(val, row) { return $h.grid.date(val, row); }
        -
            name: createdOn
            label: CreatedOn
            field: createdOn
            align: center
            sortable: true
            format: >-
                function(val, row) { return $h.grid.date(val, row); }
fields:
    -
        name: apiName
        label: ApiName
        type: text
        nullable: false
        insertable: true
        editable: false
        validations:
            - required
            - 'maxlength:128'
    -
        name: gateId
        label: Gate
        type: pick
        nullable: true
        insertable: true
        editable: true
        pick: providerGate
        format: >-
            function(val, row) { return $h.grid.field(val?.apiGate || row?.apiGate, 'name'); }
        toValue: >-
            function(val) { try { return {'gateId': val.gateId}; } catch(e) { return null; } }
    -
        name: isActive
        label: Active
        type: option
        option: YES_NO
        nullable: false
        insertable: true
        editable: true
        validations:
            - required
            - 'maxlength:1'
    -
        name: digest
        label: Digest
        type: option
        option: DIGEST
        nullable: true
        insertable: true
        editable: true
        validations:
            - 'maxlength:16'
    -
        name: secret
        label: Secret
        type: text
        nullable: false
        insertable: true
        editable: true
        validations:
            - 'maxlength:255'
    -
        name: isCheckHost
        label: Check Host
        type: option
        option: YES_NO
        nullable: true
        insertable: true
        editable: true
        validations:
            - 'maxlength:1'
    -
        name: baseUrl
        label: BaseUrl
        type: words
        nullable: true
        insertable: true
        editable: true
        validations:
            - 'maxlength:1024'
    -
        name: accessEndpoint
        label: Access Endpoint
        type: words
        nullable: true
        insertable: true
        editable: true
        validations:
            - 'maxlength:1024'
    -
        name: tokenUrl
        label: TokenUrl
        type: words
        nullable: true
        insertable: true
        editable: true
        validations:
            - 'maxlength:1024'
    -
        name: connectTimeout
        label: Connect Timeout (Seconds)
        type: number
        nullable: true
        insertable: true
        editable: true
    -
        name: readTimeout
        label: Read Timeout (Seconds)
        type: number
        nullable: true
        insertable: true
        editable: true
    -
        name: isCheckTime
        label: Check Time
        type: option
        option: YES_NO
        nullable: true
        insertable: true
        editable: true
        validations:
            - 'maxlength:1'
    -
        name: lowerTimeSpan
        label: Lower Time Span (Seconds)
        type: number
        nullable: true
        insertable: true
        editable: true
    -
        name: upperTimeSpan
        label: Upper Time Span (Seconds)
        type: number
        nullable: true
        insertable: true
        editable: true
    -
        name: accessNullExpiry
        label: Access Null Expiry (Seconds)
        type: number
        nullable: true
        insertable: true
        editable: true
    -
        name: accessExistExpiry
        label: Access Exist Expiry (Seconds)
        type: number
        nullable: true
        insertable: true
        editable: true
    -
        name: tokenNullExpiry
        label: Token Null Expiry (Seconds)
        type: number
        nullable: true
        insertable: true
        editable: true
    -
        name: tokenExistExpiry
        label: Token Exist Expiry (Seconds)
        type: number
        nullable: true
        insertable: true
        editable: true
children:
    #
    # GATE
    #
    -
        title: Gate
        crud:
            name: net.ideahut.quarkus.api.entity.ApiProviderGate
            joins:
                -
                    name: net.ideahut.quarkus.api.entity.ApiGate
                    alias: ApiGate
                    store: apiGate
                    match: contain
                    relations:
                        -
                            source: gateId
                            target: gateId
        id:
            type: COMPOSITE
            fields:
                - apiName
                - gateId
        copy: false
        relations:
            -
                source: apiName
                target: apiName
        labels:
            -
                title: ApiName
                value: apiName
            -
                title: BaseUrl
                value: baseUrl
        table:
            separator: cell
            selection: single
            page:
                options: [5, 10, 15, 20, 25, 30, 50]
                default: 20
                count: false
            order:
                field: ApiGate.name
                descending: false
            filters:
                -
                    name: ApiGate.name
                    label: Name
                    type: text
                    condition: ANY_LIKE
            visibles:
                - ApiGate.name
                - ApiGate.description
            columns:
                -
                    name: ApiGate.name
                    label: Name
                    field: apiGate
                    align: left
                    sortable: true
                    format: >-
                        function(val, row) { return $h.grid.field(val, 'name'); }
                -
                    name: ApiGate.description
                    label: Description
                    field: apiGate
                    align: left
                    sortable: true
                    format: >-
                        function(val, row) { return $h.grid.field(val, 'description'); }
        fields:
            -
                name: apiGate
                label: Gate
                type: pick
                pick: gate
                nullable: false
                insertable: true
                editable: false
                validations:
                    - required
                format: >-
                    function(val, row) { try { let o = val || row; return o.name; } catch(e) { return val; } }
                toValue: >-
                    function(val) { try { return {'gateId': val.gateId}; } catch(e) { return null; } }
        children:
            #
            # CONFIGURATION
            #
            -
                title: Configuration
                crud:
                    name: net.ideahut.quarkus.api.entity.ApiProviderGateConfig
                    joins:
                        -
                            name: net.ideahut.quarkus.api.entity.ApiGateParam
                            alias: ApiGateParam
                            store: apiGateParam
                            match: contain
                            relations:
                                -
                                    source: gateId
                                    target: gateId
                                -
                                    source: paramName
                                    target: paramName
                id:
                    type: COMPOSITE
                    fields:
                        - apiName
                        - gateId
                        - paramName
                relations:
                    -
                        source: apiName
                        target: apiName
                    -
                        source: gateId
                        target: gateId
                labels:
                    -
                        title: ApiName
                        value: apiName
                    -
                        title: Gate
                        value: apiGate.name
                table:
                    separator: cell
                    selection: single
                    page:
                        options: [5, 10, 15, 20, 25, 30, 50]
                        default: 20
                        count: false
                    order:
                        field: paramName
                        descending: false
                    visibles:
                        - paramName
                        - configValue
                        - ApiGateParam.description
                    columns:
                        -
                            name: paramName
                            label: Name
                            field: paramName
                            align: left
                            sortable: true
                        -
                            name: configValue
                            label: Value
                            field: configValue
                            align: left
                            sortable: true
                        -
                            name: ApiGateParam.description
                            label: Description
                            field: apiGateParam
                            align: left
                            sortable: true
                            format: >-
                                function(val, row) { return $h.grid.field(val, 'description'); }                                       
                fields:
                    -
                        name: paramName
                        label: Name
                        type: pick
                        pick: gateParam
                        nullable: false
                        insertable: true
                        editable: false
                        validations:
                            - required
                            - 'maxlength:128'
                        format: >-
                            function(val, row) { try { return $h.isString(val) ? val : val.paramName; } catch(e) { return val; } }
                        toValue: >-
                            function(val) { try { return { 'paramName': val.paramName }; } catch(e) { return null; } }
                    -
                        name: configValue
                        label: Value
                        type: words
                        nullable: true
                        insertable: true
                        editable: true
                        validations:
                            - 'maxlength:255'
    #
    # HOST
    #            
    -
        title: Host
        crud:
            name: net.ideahut.quarkus.api.entity.ApiProviderHost
        id:
            type: COMPOSITE
            fields:
                - apiName
                - host
        copy: false
        action:
            exclude:
                - UPDATE
                - PAGE
        relations:
            -
                source: apiName
                target: apiName
        labels:
            -
                title: ApiName
                value: apiName
            -
                title: BaseUrl
                value: baseUrl
        table:
            separator: cell
            selection: single
            page:
                options: [5, 10, 15, 20, 25, 30, 50]
                default: 20
                count: false
            order:
                field: host
                descending: false
            filters:
                -
                    name: host
                    label: Host
                    type: text
                    condition: ANY_LIKE
            visibles:
                - host
            columns:
                -
                    name: host
                    label: Host
                    field: host
                    align: left
                    sortable: true
        fields:
            -
                name: host
                label: Host
                type: text
                nullable: false
                insertable: true
                editable: false
                validations:
                    - required
                    - 'maxlength:128'
    #
    # CRUD
    #
    -
        title: CRUD
        crud:
            name: net.ideahut.quarkus.api.entity.ApiProviderCrud
            joins:
                -
                    name: net.ideahut.quarkus.api.entity.ApiCrud
                    alias: ApiCrud
                    store: apiCrud
                    match: contain
                    relations:
                    -
                        source: apiCrudCode
                        target: apiCrudCode    
        id:
            type: COMPOSITE
            fields:
                - apiName
                - apiCrudCode
        relations:
            -
                source: apiName
                target: apiName
        labels:
            -
                title: ApiName
                value: apiName
            -
                title: BaseUrl
                value: baseUrl       
        copy: false
        table:
            separator: cell
            selection: single
            page:
                options: [5, 10, 15, 20, 25, 30, 50]
                default: 20
                count: false
            order:
                field: apiCrudCode
                descending: false
            filters:
                -
                    name: apiCrudCode
                    label: Code
                    type: text
                    condition: ANY_LIKE
                -
                    name: ApiCrud.className
                    label: Class
                    type: text
                    condition: ANY_LIKE
                -
                    name: ApiCrud.packageName
                    label: Package
                    type: text
                    condition: ANY_LIKE
                -
                    name: ApiCrud.manager
                    label: Manager
                    type: text
                    condition: ANY_LIKE
            visibles:
                - apiCrudCode
                - apiCrud.className
                - apiCrud.packageName
                - apiCrud.manager
                - updatedOn
                - createdOn
            columns:
                -
                    name: apiCrudCode
                    label: Code
                    field: apiCrudCode
                    align: left
                    sortable: true
                -
                    name: apiCrud.className
                    label: Class
                    field: apiCrud
                    align: left
                    sortable: true
                    format: >-
                        function(val, row) { return $h.grid.field(val, 'className'); }
                -
                    name: apiCrud.packageName
                    label: Package
                    field: apiCrud
                    align: left
                    sortable: true
                    format: >-
                        function(val, row) { return $h.grid.field(val, 'packageName'); }
                -
                    name: apiCrud.manager
                    label: Manager
                    field: apiCrud
                    align: left
                    sortable: true
                    format: >-
                        function(val, row) { return $h.grid.field(val, 'manager'); }
                -
                    name: updatedOn
                    label: UpdatedOn
                    field: updatedOn
                    align: center
                    sortable: true
                    format: >-
                        function(val, row) { return $h.grid.date(val, row); }
                -
                    name: createdOn
                    label: CreatedOn
                    field: createdOn
                    align: center
                    sortable: true
                    format: >-
                        function(val, row) { return $h.grid.date(val, row); }
        fields:
            -
                name: apiCrud
                label: CRUD Resource
                type: pick
                pick: crud
                nullable: false
                insertable: true
                editable: false
                validations:
                    - required
                format: >-
                    function(val, row) { try { let o = val || row; return o.apiCrudCode; } catch(e) { return val; } }
                toValue: >-
                    function(val) { try { return {'apiCrudCode': val.apiCrudCode}; } catch(e) { return null; } }
        children:
            #
            # ACTION
            #
            -
                title: Action
                crud:
                    name: net.ideahut.quarkus.api.entity.ApiProviderCrudAction
                id:
                    type: COMPOSITE
                    fields:
                        - apiName
                        - apiCrudCode
                        - action
                copy: false
                action:
                    exclude:
                        - UPDATE
                        - PAGE
                relations:
                    -
                        source: apiName
                        target: apiName
                    -
                        source: apiCrudCode
                        target: apiCrudCode
                labels:
                    -
                        title: ApiName
                        value: apiName
                    -
                        title: CRUD
                        value: apiCrudCode
                table:
                    separator: cell
                    selection: multiple
                    page:
                        options: [5, 10, 15, 20, 25, 30, 50]
                        default: 20
                        count: false
                    order:
                        field: action
                        descending: false
                    visibles:
                        - action
                    columns:
                        -
                            name: action
                            label: Action
                            field: action
                            align: left
                            sortable: true
                            format: >-
                                function(val, row) { return $h.grid.option(val, row, 'CRUD_ACTION'); }
                fields:
                    -
                        name: action
                        label: Action
                        type: option
                        option: CRUD_ACTION
                        nullable: false
                        insertable: true
                        editable: false
                        validations:
                            - required
            #
            # FILTER
            #
            -
                title: Filter
                crud:
                    name: net.ideahut.quarkus.api.entity.ApiProviderCrudFilter
                id:
                    type: STANDARD
                    fields:
                        - filterId
                relations:
                    -
                        source: apiName
                        target: apiName
                    -
                        source: apiCrudCode
                        target: apiCrudCode
                labels:
                    -
                        title: ApiName
                        value: apiName
                    -
                        title: CRUD
                        value: apiCrudCode
                table:
                    separator: cell
                    selection: single
                    page:
                        options: [5, 10, 15, 20, 25, 30, 50]
                        default: 20
                        count: false
                    order:
                        field: fieldName
                        descending: false
                    filters:
                        -
                            name: fieldName
                            label: Field
                            type: text
                            condition: ANY_LIKE
                        -
                            name: filterCondition
                            label: Condition
                            type: option
                            option: SPECIFIC_CONDITION
                            condition: EQUAL
                        -
                            name: isPlainValue
                            label: Plain
                            type: option
                            option: YES_NO
                            condition: EQUAL
                    visibles:
                        - fieldName
                        - filterCondition
                        - filterValue
                        - isPlainValue
                    columns:
                        -
                            name: fieldName
                            label: Field
                            field: fieldName
                            align: left
                            sortable: true
                        -
                            name: filterCondition
                            label: Condition
                            field: filterCondition
                            align: center
                            sortable: true
                            format: >-
                                function(val, row) { return $h.grid.option(val, row, 'SPECIFIC_CONDITION'); }
                        -
                            name: filterValue
                            label: Value
                            field: filterValue
                            align: left
                            sortable: true    
                        -
                            name: isPlainValue
                            label: Plain
                            field: isPlainValue
                            align: center
                            sortable: true
                            format: >-
                                function(val, row) { return $h.grid.option(val, row, 'YES_NO'); }
                fields:
                    -
                        name: fieldName
                        label: Field
                        type: text
                        nullable: false
                        insertable: true
                        editable: true
                        validations:
                            - required
                            - 'maxlength:128'
                    -
                        name: filterCondition
                        label: Condition
                        type: option
                        option: SPECIFIC_CONDITION
                        nullable: false
                        insertable: true
                        editable: true
                        validations:
                            - required
                            - 'maxlength:16'
                    -
                        name: filterValue
                        label: Value
                        type: words
                        nullable: true
                        insertable: true
                        editable: true
                        validations:
                            - 'maxlength:1024'
                    -
                        name: isPlainValue
                        label: Plain
                        type: option
                        option: YES_NO
                        nullable: true
                        insertable: true
                        editable: true
                        validations:
                            - 'maxlength:1'    
    #
    # REQUEST
    #
    -
        title: Request
        crud:
            name: net.ideahut.quarkus.api.entity.ApiProviderRequest 
        id:
            type: COMPOSITE
            fields:
                - apiName
                - packageName
                - className
                - functionName
                - parameterCount
        relations:
            -
                source: apiName
                target: apiName
        labels:
            -
                title: ApiName
                value: apiName
            -
                title: BaseUrl
                value: baseUrl
        action:
            exclude:
                - UPDATE        
        table:
            separator: cell
            selection: single
            page:
                options: [5, 10, 15, 20, 25, 30, 50]
                default: 20
                count: false
            order:
                field: patterns
                descending: false
            filters:
                -
                    name: patterns
                    label: Pattern
                    type: text
                    condition: ANY_LIKE
                -
                    name: methods
                    label: Method
                    type: text
                    condition: ANY_LIKE    
                -
                    name: packageName
                    label: Package
                    type: text
                    condition: ANY_LIKE
                -
                    name: className
                    label: Class
                    type: text
                    condition: ANY_LIKE
                -
                    name: functionName
                    label: Function
                    type: text
                    condition: ANY_LIKE
            visibles:
                - patterns
                - methods
                - packageName
                - className
                - functionName
                - updatedOn
                - createdOn
            columns:
                -
                    name: patterns
                    label: Pattern
                    field: patterns
                    align: left
                    sortable: true
                -
                    name: methods
                    label: Method
                    field: methods
                    align: left
                    sortable: true
                -
                    name: packageName
                    label: Package
                    field: packageName
                    align: left
                    sortable: true
                -
                    name: className
                    label: Class
                    field: className
                    align: left
                    sortable: true
                -
                    name: functionName
                    label: Function
                    field: functionName
                    align: left
                    sortable: true
                    format: >-
                        function(val, row) { try { return row.functionName + " (" + row.parameterCount + ")"; } catch(e) { return val; } }
                -
                    name: updatedOn
                    label: UpdatedOn
                    field: updatedOn
                    align: center
                    sortable: true
                    format: >-
                        function(val, row) { return $h.grid.date(val, row); }
                -
                    name: createdOn
                    label: CreatedOn
                    field: createdOn
                    align: center
                    sortable: true
                    format: >-
                        function(val, row) { return $h.grid.date(val, row); }
        fields:
            -
                name: request
                label: Request Resource
                type: pick
                pick: request
                nullable: false
                insertable: true
                editable: false
                validations:
                    - required
                #rowToValue: >-
                #     function(row) { try { return { 'packageName': row.packageName,
                #     'className': row.className, 'functionName': row.functionName,
                #     'parameterCount': row.parameterCount, 'methods': row.methods,
                #     'patterns': row.patterns, 'consumes': row.consumes, 'produces':
                #     row.produces }; } catch(e) { return null; } }
                format: >-
                    function(val, row) { try { let o = val || row; return o.patterns; }
                    catch(e) { return val; } }
                toValue: >-
                    function(val) { try { return {'packageName': val.packageName,
