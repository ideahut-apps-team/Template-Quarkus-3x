##
# Setup System Properties
# Tambahkan JVM argument: -Dideahut.system.properties=file:{user.dir}}/ideahut.properties
#

## untuk versi jdk yang lebih kecil dari versi 24 (bug thread pinning)
#jdk.virtualThreadScheduler.parallelism=32

## default charset yang digunakan di StringHelper
#ideahut.stringHelper.defaultCharset=utf8

## disable virtual thread secara global di ThreadConcurrencyExecutor
#ideahut.threadConcurrencyExecutor.disableVirtualThread=false

## maksimum concurrency secara global di ThreadConcurrencyExecutor
#ideahut.threadConcurrencyExecutor.maxConcurrency=128

## disable virtual thread secara global di WebFluxHelper
#ideahut.webFluxHelper.disableVirtualThread=false